id = "cheats"
name = "Cheats & Infinite Resources"
version = "1.0.0"
manifest_version = 2
author = "Looking Glass Team"
description = "Gameplay modifications including infinite health, infinite will/ammo, god mode, no-target mode, and all weapons unlocked"
homepage = "https://github.com/looking-glass/looking-glass-mod"
repository = "https://github.com/looking-glass/looking-glass-mod"
license = "MIT"
game_target = "Alice"
min_game_version = "1.0.0"
max_game_version = "2.0.0"
dependencies = []
load_order = { before = [], after = [] }
entry_points = { runtime_hook = "scripts/cheats.rs", config_inject = "scripts/config.rs" }
config_schema = {
  "type": "object",
  "properties": {
    "infinite_health": { "type": "boolean", "default": true, "description": "Prevent health (sanity) from decreasing" },
    "infinite_will": { "type": "boolean", "default": true, "description": "Prevent will (ammo/mana) from decreasing" },
    "god_mode": { "type": "boolean", "default": false, "description": "Complete invincibility - no damage taken" },
    "no_target": { "type": "boolean", "default": false, "description": "Enemies ignore the player" },
    "infinite_ammo": { "type": "boolean", "default": true, "description": "Weapons don't consume will when firing" },
    "all_weapons": { "type": "boolean", "default": false, "description": "Unlock all weapons" },
    "max_weapon_copies": { "type": "boolean", "default": false, "description": "Max copies of multi-copy weapons (Demon Dice)" },
    "one_hit_kill": { "type": "boolean", "default": false, "description": "Enemies die in one hit" },
    "no_clip": { "type": "boolean", "default": false, "description": "Walk through walls (requires game support)" }
  },
  "required": []
}
default_config = {
  "infinite_health": true,
  "infinite_will": true,
  "god_mode": false,
  "no_target": false,
  "infinite_ammo": true,
  "all_weapons": false,
  "max_weapon_copies": false,
  "one_hit_kill": false,
  "no_clip": false
}
assets = []
tags = ["gameplay", "cheats", "infinite", "godmode", "quality-of-life"]