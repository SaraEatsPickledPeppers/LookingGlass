[package]
name = "looking-glass-mod"
version = "0.1.0"
edition = "2021"
description = "Core mod system types and functionality for Looking Glass"
license = "MIT OR Apache-2.0"
repository = "https://github.com/looking-glass/looking-glass"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
anyhow = "1.0"
walkdir = "2.5"
dirs = "5.0"
sha2 = "0.10"
tempfile = "3.8"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
toml = { version = "0.8", features = ["parse", "display"] }
jsonschema = "0.16"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
pretty_assertions = "1.4"