[workspace]
resolver = "2"
members = [
    "crates/looking-glass-engine",
    "crates/looking-glass-mod",
    "crates/looking-glass-config",
    "crates/looking-glass-core",
    "crates/looking-glass-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/looking-glass/looking-glass"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"
directories = "5.0"
walkdir = "2.5"
notify = { version = "6.0", features = ["crossbeam-channel"] }
parking_lot = "0.12"
once_cell = "1.19"
semver = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
jsonschema = { version = "0.60", default-features = false, features = ["resolve-file"] }
tempfile = "3.8"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
dirs = "5.0"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
mlua = { version = "0.10", features = ["vendored"] }
wasmtime = "25.0"
rmp-serde = "1.1"
bincode = "1.3"
x11rb = { version = "0.14" }
wayland-client = { version = "0.31" }
wayland-protocols = { version = "0.32", features = ["staging", "unstable", "client"] }
gilrs = { version = "0.10" }
log = "0.4"

# Engine dependencies (for the looking-glass binary - defined in its own Cargo.toml)
# macroquad, rodio, image, fontdue, hound, encoding_rs, deunicode, glam, log

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"